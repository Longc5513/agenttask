<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="cg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="vg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" rx="12" fill="#0f172a"/>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <rect width="900" height="400" rx="12" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="3">SYSTEM ARCHITECTURE</text>

  <!-- FRONTEND Layer -->
  <rect x="30" y="45" width="840" height="110" rx="10" fill="url(#fg)" stroke="#6366f1" stroke-width="1"/>
  <text x="50" y="65" fill="#6366f1" font-size="10" font-weight="700" letter-spacing="2">FRONTEND</text>

  <!-- Wallet -->
  <rect x="50" y="75" width="130" height="55" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="115" y="98" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">👛 Wallet</text>
  <text x="115" y="115" text-anchor="middle" fill="#a5b4fc" font-size="8">OKX / MetaMask</text>

  <!-- genlayer-js -->
  <rect x="200" y="75" width="150" height="55" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="275" y="98" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">📦 genlayer-js</text>
  <text x="275" y="115" text-anchor="middle" fill="#a5b4fc" font-size="8">SDK Client v1.1.8</text>

  <!-- Actions Panel -->
  <rect x="370" y="75" width="180" height="55" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="460" y="95" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">⚡ Actions Panel</text>
  <text x="460" y="110" text-anchor="middle" fill="#a5b4fc" font-size="8">Quick Fill · Import JSON · Forms</text>

  <!-- AgentBot Guide -->
  <rect x="570" y="75" width="140" height="55" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="640" y="98" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">🤖 AgentBot</text>
  <text x="640" y="115" text-anchor="middle" fill="#a5b4fc" font-size="8">Voice + Step Guide</text>

  <!-- Ledger -->
  <rect x="730" y="75" width="120" height="55" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="790" y="98" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">📋 Ledger</text>
  <text x="790" y="115" text-anchor="middle" fill="#a5b4fc" font-size="8">Live mandates</text>

  <!-- Connection arrows down -->
  <line x1="450" y1="130" x2="450" y2="175" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <text x="460" y="158" fill="#4b5563" font-size="8">RPC</text>

  <!-- GENLAYER CONTRACT Layer -->
  <rect x="30" y="178" width="840" height="100" rx="10" fill="url(#cg)" stroke="#10b981" stroke-width="1"/>
  <text x="50" y="198" fill="#10b981" font-size="10" font-weight="700" letter-spacing="2">GENLAYER STUDIO NET (61999)</text>

  <!-- Contract box -->
  <rect x="180" y="208" width="540" height="55" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="450" y="232" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">AgentTask Contract</text>
  <text x="450" y="250" text-anchor="middle" fill="#6ee7b7" font-size="9">Mandate Ledger · Bond Custody · Lifecycle State Machine · emit_transfer()</text>

  <!-- Contract address -->
  <rect x="270" y="268" width="360" height="18" rx="4" fill="#020617" stroke="#1e293b" stroke-width="0.5"/>
  <text x="450" y="281" text-anchor="middle" fill="#4b5563" font-size="8" font-family="monospace">0x33E354284635b4462Eb3e9491923D7EC259a7712</text>

  <!-- Validator Layer -->
  <rect x="30" y="300" width="840" height="80" rx="10" fill="url(#vg)" stroke="#8b5cf6" stroke-width="1"/>
  <text x="50" y="320" fill="#8b5cf6" font-size="10" font-weight="700" letter-spacing="2">VALIDATOR CONSENSUS LAYER</text>

  <!-- Three validators -->
  <rect x="120" y="332" width="160" height="35" rx="6" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="200" y="350" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">🔍 Validator #1</text>
  <text x="200" y="362" text-anchor="middle" fill="#c4b5fd" font-size="7">Fetches evidence independently</text>

  <rect x="370" y="332" width="160" height="35" rx="6" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="450" y="350" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">🔍 Validator #2</text>
  <text x="450" y="362" text-anchor="middle" fill="#c4b5fd" font-size="7">gl.nondet.web.render()</text>

  <rect x="620" y="332" width="160" height="35" rx="6" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="700" y="350" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">🔍 Validator #3</text>
  <text x="700" y="362" text-anchor="middle" fill="#c4b5fd" font-size="7">eq_principle consensus</text>

  <!-- Consensus arrows -->
  <line x1="370" y1="340" x2="355" y2="340" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="530" y1="340" x2="545" y2="340" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="355" y="333" text-anchor="middle" fill="#7c3aed" font-size="7">consensus</text>
  <text x="630" y="333" text-anchor="middle" fill="#7c3aed" font-size="7">consensus</text>

  <!-- Connection Contract to Validators -->
  <line x1="350" y1="263" x2="200" y2="330" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="450" y1="263" x2="450" y2="330" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="550" y1="263" x2="700" y2="330" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Labels -->
  <text x="850" y="100" text-anchor="end" fill="#6366f1" font-size="8" font-weight="600">Next.js 16</text>
  <text x="850" y="250" text-anchor="end" fill="#10b981" font-size="8" font-weight="600">Python</text>
  <text x="850" y="350" text-anchor="end" fill="#8b5cf6" font-size="8" font-weight="600">GenVM</text>
</svg>
