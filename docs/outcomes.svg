<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.03"/>
    </linearGradient>
    <linearGradient id="r" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.03"/>
    </linearGradient>
    <linearGradient id="y" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.03"/>
    </linearGradient>
    <linearGradient id="gr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#64748b;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:0.03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="220" rx="12" fill="#0f172a"/>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="3">ADJUDICATION OUTCOMES</text>

  <!-- Bond bar -->
  <rect x="40" y="45" width="620" height="8" rx="4" fill="#1e293b"/>

  <!-- FULFILLED -->
  <rect x="40" y="70" width="300" height="55" rx="8" fill="url(#g)" stroke="#10b981" stroke-width="1"/>
  <text x="60" y="92" fill="#10b981" font-size="20">✅</text>
  <text x="90" y="92" fill="#fff" font-size="14" font-weight="700">FULFILLED</text>
  <text x="90" y="110" fill="#6ee7b7" font-size="10">Agent gets 100% bond</text>
  <rect x="40" y="45" width="300" height="8" rx="4" fill="#10b981"/>
  <text x="190" y="52" text-anchor="middle" fill="#020617" font-size="7" font-weight="700">100% → AGENT</text>

  <!-- REJECTED -->
  <rect x="360" y="70" width="300" height="55" rx="8" fill="url(#r)" stroke="#ef4444" stroke-width="1"/>
  <text x="380" y="92" fill="#ef4444" font-size="20">❌</text>
  <text x="410" y="92" fill="#fff" font-size="14" font-weight="700">REJECTED</text>
  <text x="410" y="110" fill="#fca5a5" font-size="10">Principal gets 100% bond</text>

  <!-- PARTIAL -->
  <rect x="40" y="140" width="300" height="55" rx="8" fill="url(#y)" stroke="#f59e0b" stroke-width="1"/>
  <text x="60" y="162" fill="#f59e0b" font-size="20">🔶</text>
  <text x="90" y="162" fill="#fff" font-size="14" font-weight="700">PARTIAL</text>
  <text x="90" y="180" fill="#fcd34d" font-size="10">Agent gets partial_pct% · Principal gets remainder</text>

  <!-- UNAVAILABLE -->
  <rect x="360" y="140" width="300" height="55" rx="8" fill="url(#gr)" stroke="#64748b" stroke-width="1"/>
  <text x="380" y="162" fill="#64748b" font-size="20">⚠️</text>
  <text x="410" y="162" fill="#fff" font-size="14" font-weight="700">UNAVAILABLE</text>
  <text x="410" y="180" fill="#94a3b8" font-size="10">Recovery window · Both approve 50/50 split</text>

  <!-- Bond split visualization for PARTIAL -->
  <rect x="40" y="195" width="180" height="6" rx="3" fill="#f59e0b"/>
  <rect x="220" y="195" width="120" height="6" rx="3" fill="#6366f1"/>
  <text x="130" y="210" text-anchor="middle" fill="#fcd34d" font-size="7">AGENT %</text>
  <text x="280" y="210" text-anchor="middle" fill="#a5b4fc" font-size="7">PRINCIPAL %</text>
</svg>
