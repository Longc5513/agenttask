<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="white" font-size="20" font-weight="800">AGENTTASK ARCHITECTURE</text>
  <text x="450" y="62" text-anchor="middle" fill="#6b7280" font-size="11">Bonded Mandate Lifecycle on GenLayer</text>

  <!-- Principal Box -->
  <rect x="30" y="100" width="140" height="180" rx="12" fill="#111118" stroke="#6366f1" stroke-width="2"/>
  <text x="100" y="130" text-anchor="middle" fill="#6366f1" font-size="10" font-weight="700" text-transform="uppercase">PRINCIPAL</text>
  <text x="100" y="150" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Task Creator</text>
  <text x="100" y="180" text-anchor="middle" fill="#9ca3af" font-size="9">• Posts mandate</text>
  <text x="100" y="195" text-anchor="middle" fill="#9ca3af" font-size="9">• Locks bond (GEN)</text>
  <text x="100" y="210" text-anchor="middle" fill="#9ca3af" font-size="9">• Reviews delivery</text>
  <text x="100" y="225" text-anchor="middle" fill="#9ca3af" font-size="9">• Challenges if bad</text>
  <circle cx="100" cy="260" r="12" fill="url(#purple)" filter="url(#glow)"/>
  <text x="100" y="264" text-anchor="middle" fill="white" font-size="10">👤</text>

  <!-- Contract Box (center) -->
  <rect x="240" y="90" width="420" height="320" rx="16" fill="#111118" stroke="#6366f1" stroke-width="2"/>
  <text x="450" y="118" text-anchor="middle" fill="#6366f1" font-size="12" font-weight="800">GENLAYER INTELLIGENT CONTRACT</text>
  <text x="450" y="135" text-anchor="middle" fill="#4b5563" font-size="9" font-family="monospace">0x33E35428...9a7712</text>

  <!-- State Machine -->
  <rect x="260" y="150" width="380" height="80" rx="8" fill="#0a0a0f" stroke="#2a2a3e" stroke-width="1"/>
  <text x="450" y="170" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="700">STATE MACHINE</text>
  <text x="310" y="192" text-anchor="middle" fill="#6b7280" font-size="8">DRAFT</text>
  <text x="340" y="192" text-anchor="middle" fill="#6366f1" font-size="8">→</text>
  <text x="375" y="192" text-anchor="middle" fill="#8b5cf6" font-size="8">OFFERED</text>
  <text x="410" y="192" text-anchor="middle" fill="#6366f1" font-size="8">→</text>
  <text x="445" y="192" text-anchor="middle" fill="#3b82f6" font-size="8">ACTIVE</text>
  <text x="475" y="192" text-anchor="middle" fill="#6366f1" font-size="8">→</text>
  <text x="510" y="192" text-anchor="middle" fill="#f59e0b" font-size="8">DELIVERED</text>
  <text x="550" y="192" text-anchor="middle" fill="#6366f1" font-size="8">→</text>
  <text x="585" y="192" text-anchor="middle" fill="#ef4444" font-size="8">CHALLENGED</text>
  <text x="625" y="192" text-anchor="middle" fill="#6366f1" font-size="8">→</text>
  <text x="340" y="210" text-anchor="middle" fill="#8b5cf6" font-size="8">RULING_READY</text>
  <text x="400" y="210" text-anchor="middle" fill="#6366f1" font-size="8">→</text>
  <text x="445" y="210" text-anchor="middle" fill="#10b981" font-size="8">SETTLED ✓</text>

  <!-- AI Jury Box -->
  <rect x="270" y="245" width="170" height="70" rx="10" fill="#0a0a0f" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="355" y="270" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="700">🤖 AI JURY</text>
  <text x="355" y="288" text-anchor="middle" fill="#9ca3af" font-size="8">exec_prompt()</text>
  <text x="355" y="302" text-anchor="middle" fill="#9ca3af" font-size="8">eq_principle.prompt_comparative()</text>

  <!-- Settlement Box -->
  <rect x="460" y="245" width="170" height="70" rx="10" fill="#0a0a0f" stroke="#10b981" stroke-width="1.5"/>
  <text x="545" y="270" text-anchor="middle" fill="#10b981" font-size="10" font-weight="700">💰 SETTLEMENT</text>
  <text x="545" y="288" text-anchor="middle" fill="#9ca3af" font-size="8">emit_transfer()</text>
  <text x="545" y="302" text-anchor="middle" fill="#9ca3af" font-size="8">Real GEN — no synthetic</text>

  <!-- Bond indicator -->
  <rect x="260" y="330" width="380" height="30" rx="6" fill="#1a1a2e" stroke="#2a2a3e" stroke-width="1"/>
  <text x="350" y="350" text-anchor="middle" fill="#6366f1" font-size="9" font-weight="600">🔒 BOND LOCKED</text>
  <text x="540" y="350" text-anchor="middle" fill="#10b981" font-size="9" font-weight="600">✅ VALUE TRANSFERRED</text>

  <!-- Agent Box -->
  <rect x="730" y="100" width="140" height="180" rx="12" fill="#111118" stroke="#10b981" stroke-width="2"/>
  <text x="800" y="130" text-anchor="middle" fill="#10b981" font-size="10" font-weight="700">AGENT</text>
  <text x="800" y="150" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Worker</text>
  <text x="800" y="180" text-anchor="middle" fill="#9ca3af" font-size="9">• Accepts mandate</text>
  <text x="800" y="195" text-anchor="middle" fill="#9ca3af" font-size="9">• Submits deliverable</text>
  <text x="800" y="210" text-anchor="middle" fill="#9ca3af" font-size="9">• Gets paid if fulfilled</text>
  <text x="800" y="225" text-anchor="middle" fill="#9ca3af" font-size="9">• Bond slashed if rejected</text>
  <circle cx="800" cy="260" r="12" fill="url(#green)" filter="url(#glow)"/>
  <text x="800" y="264" text-anchor="middle" fill="white" font-size="10">🤖</text>

  <!-- Evidence Sources -->
  <rect x="30" y="340" width="180" height="80" rx="10" fill="#0a0a0f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="120" y="365" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="700">📦 EVIDENCE SOURCES</text>
  <text x="120" y="385" text-anchor="middle" fill="#9ca3af" font-size="9">IPFS — immutable brief</text>
  <text x="120" y="400" text-anchor="middle" fill="#9ca3af" font-size="9">Arweave — delivery snapshots</text>

  <!-- Validators -->
  <rect x="700" y="340" width="180" height="80" rx="10" fill="#0a0a0f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="790" y="365" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="700">⚖️ VALIDATORS (3x)</text>
  <text x="790" y="385" text-anchor="middle" fill="#9ca3af" font-size="9">Independent evidence fetch</text>
  <text x="790" y="400" text-anchor="middle" fill="#9ca3af" font-size="9">Consensus = majority agree</text>

  <!-- Arrows: Principal → Contract -->
  <line x1="170" y1="180" x2="238" y2="180" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="205" y="172" text-anchor="middle" fill="#6b7280" font-size="7">bond + brief</text>

  <!-- Arrows: Agent → Contract -->
  <line x1="730" y1="180" x2="662" y2="180" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="695" y="172" text-anchor="middle" fill="#6b7280" font-size="7">deliver</text>

  <!-- Arrows: Contract → Evidence -->
  <line x1="355" y1="315" x2="200" y2="340" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="260" y="330" text-anchor="middle" fill="#6b7280" font-size="7">fetch</text>

  <!-- Arrows: Contract → Validators -->
  <line x1="545" y1="315" x2="700" y2="340" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="640" y="330" text-anchor="middle" fill="#6b7280" font-size="7">adjudicate</text>

  <!-- Footer -->
  <text x="450" y="460" text-anchor="middle" fill="#4b5563" font-size="10">StudioNet 61999 • Real GEN Transfers • AI Consensus</text>
  <text x="450" y="480" text-anchor="middle" fill="#6366f1" font-size="11" font-weight="600">agenttask.vercel.app</text>
</svg>
